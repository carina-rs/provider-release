name: Yank from Carina Registry
description: Yank a provider release from the Carina registry

inputs:
  name:
    description: Provider name in the registry, such as aws
    required: true
  namespace:
    description: Provider namespace in the registry, such as carina-rs
    required: true
  registry-audience:
    description: Audience for the registry OIDC token
    required: false
    default: registry.carina-rs.dev
  registry-yank-url:
    description: Registry yank endpoint
    required: false
    default: https://publish.registry.carina-rs.dev/v1/yank

runs:
  using: composite
  steps:
    - name: Validate Release Tag
      shell: bash
      run: |
        set -euo pipefail

        version="${GITHUB_REF_NAME#v}"
        if [ -z "$version" ] || [ "$GITHUB_REF" != "refs/tags/v${version}" ]; then
          printf 'Expected GITHUB_REF to be exactly refs/tags/v{version} with a non-empty version; got GITHUB_REF=%s and GITHUB_REF_NAME=%s\n' "$GITHUB_REF" "$GITHUB_REF_NAME" >&2
          exit 1
        fi
        printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"

    - name: Yank from Carina Registry
      shell: bash
      env:
        PROVIDER_NAME: ${{ inputs.name }}
        PROVIDER_NAMESPACE: ${{ inputs.namespace }}
        REGISTRY_AUDIENCE: ${{ inputs.registry-audience }}
        REGISTRY_YANK_URL: ${{ inputs.registry-yank-url }}
      run: |
        set -euo pipefail

        # VERSION is exported through GITHUB_ENV by Validate Release Tag.
        # shellcheck disable=SC2153
        version="$VERSION"
        payload=$(jq -n \
          --arg namespace "$PROVIDER_NAMESPACE" \
          --arg name "$PROVIDER_NAME" \
          --arg version "$version" \
          '{
            namespace: $namespace,
            name: $name,
            version: $version
          }')
        response_file=$(mktemp)
        trap 'rm -f "$response_file"' EXIT

        for attempt in 1 2 3; do
          if ! token=$(curl -sS \
            --connect-timeout 10 \
            --max-time 60 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${REGISTRY_AUDIENCE}" \
            | jq -er .value) || [ -z "$token" ]; then
            printf 'Failed to obtain OIDC token on attempt %s\n' "$attempt" >&2
            if [ "$attempt" -lt 3 ]; then
              sleep 10
              continue
            fi
            printf 'Yank failed after 3 attempts while obtaining OIDC token\n' >&2
            exit 1
          fi

          : > "$response_file"
          if ! status=$(curl -sS \
            --connect-timeout 10 \
            --max-time 120 \
            -o "$response_file" \
            -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$REGISTRY_YANK_URL"); then
            status=000
          fi

          printf 'Yank attempt %s returned HTTP %s\n' "$attempt" "$status"
          sed 's/^/  /' "$response_file"
          printf '\n'

          case "$status" in
            200|201)
              exit 0
              ;;
            000|429|5??)
              if [ "$attempt" -lt 3 ]; then
                sleep 10
                continue
              fi
              printf 'Yank failed after 3 attempts (last status: %s)\n' "$status" >&2
              exit 1
              ;;
            4??)
              printf 'Yank failed with non-retryable status %s\n' "$status" >&2
              exit 1
              ;;
            *)
              printf 'Yank failed with unexpected status %s\n' "$status" >&2
              exit 1
              ;;
          esac
        done
